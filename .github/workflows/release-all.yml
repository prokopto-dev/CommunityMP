name: Release all platforms

# One tag -> Windows installer, both macOS dmgs, Linux client + server tarballs,
# the server container image, and a single GitHub Release carrying all of them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. cmp-2026-09-06)
        required: true
        type: string
      prerelease:
        default: true
        type: boolean
  push:
    tags:
      - 'cmp-*'

permissions:
  contents: write
  packages: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true
      release: false
    secrets: inherit

  macos:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-15-intel]
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.image }}
      build-type: Release
    secrets: inherit

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Add OpenMW PPA
        run: sudo add-apt-repository -y ppa:openmw/openmw && sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic
          sudo apt-get install -y --no-install-recommends libboost-filesystem-dev ninja-build

      - name: Cache GameNetworkingSockets
        id: gns-cache
        uses: actions/cache@v4
        with:
          path: deps/vcpkg-gns/installed
          key: gns-x64-linux-v2

      - name: Build GameNetworkingSockets
        if: steps.gns-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git deps/vcpkg-gns
          ./deps/vcpkg-gns/bootstrap-vcpkg.sh -disableMetrics
          ./deps/vcpkg-gns/vcpkg install gamenetworkingsockets --triplet x64-linux

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-linux
          max-size: 1500M

      # client and server together; the launcher needs no Qt and the Hub needs
      # npm, so both stay off
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -D CMAKE_BUILD_TYPE=RelWithDebInfo
          -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          -D "CMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=RelWithDebInfo;Release;None;"
          -D CMAKE_PREFIX_PATH=${{ github.workspace }}/deps/vcpkg-gns/installed/x64-linux
          -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON -D OPENMW_USE_SYSTEM_BULLET=OFF
          -D USE_SYSTEM_TINYXML=ON
          -D BUILD_TES3MP_SERVER=ON -D BUILD_TES3MP_CLIENT=ON -D BUILD_OPENMW=ON
          -D BUILD_COMMUNITYMP_LAUNCHER=OFF -D BUILD_COMMUNITYMP_HUB=OFF
          -D BUILD_OPENCS=OFF -D BUILD_LAUNCHER=OFF -D BUILD_WIZARD=OFF
          -D BUILD_ESMTOOL=OFF -D BUILD_BSATOOL=OFF -D BUILD_NAVMESHTOOL=OFF
          -D BUILD_BULLETOBJECTTOOL=OFF -D BUILD_NIFTEST=OFF
          -D BUILD_ESSIMPORTER=OFF -D BUILD_MWINIIMPORTER=OFF
          -D BUILD_BENCHMARKS=OFF -D BUILD_COMPONENTS_TESTS=OFF
          -D BUILD_OPENMW_TESTS=OFF -D BUILD_OPENCS_TESTS=OFF

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Stage server
        run: |
          set -eux
          mkdir -p stage-server
          cp build/communitymp-server build/communitymp-server-default.cfg stage-server/
          cp -a build/server stage-server/server
          git rev-parse HEAD > stage-server/COMMIT
          ldd stage-server/communitymp-server | awk '/=> \//{print $3}' | sort -u \
            | xargs -r dpkg -S 2>/dev/null | cut -d: -f1 | sort -u > stage-server/runtime-deps.txt
          tar czf communitymp-server-linux-x86_64.tar.gz -C stage-server .

      - name: Stage client
        run: |
          set -eux
          mkdir -p stage-client
          cp build/communitymp-client stage-client/
          cp build/communitymp-client-default.cfg stage-client/ 2>/dev/null || true
          cp -a build/resources stage-client/resources
          git rev-parse HEAD > stage-client/COMMIT
          tar czf communitymp-client-linux-x86_64.tar.gz -C stage-client .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarballs
          path: |
            communitymp-server-linux-x86_64.tar.gz
            communitymp-client-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-server-stage
          path: stage-server/

  image:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-server-stage
          path: stage
      - run: chmod +x stage/communitymp-server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.communitymp-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/communitymp-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/communitymp-server:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/communitymp-server:latest

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect release assets
        run: |
          set -eux
          mkdir -p assets
          find dl -name '*.exe' -exec cp {} assets/ \;
          find dl -name '*.dmg' -exec cp {} assets/ \;
          find dl -name '*.tar.gz' -exec cp {} assets/ \;
          ls -la assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eux
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "CommunityMP $TAG" \
            --notes "Automated build of ${{ github.sha }}. Server image: ghcr.io/${{ github.repository_owner }}/communitymp-server:$TAG" \
            ${{ (inputs.prerelease == false) && ' ' || '--prerelease' }} \
            assets/* || gh release upload "$TAG" assets/* --clobber --repo "${{ github.repository }}"
